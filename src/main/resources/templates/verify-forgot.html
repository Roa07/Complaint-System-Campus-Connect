<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        form {
            background: rgb(253, 253, 253);
            padding: 30px;
            width: 320px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background-color: #28a745;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Enter OTP</h2>
    <div th:if="${param.error}" style="color:red; margin-bottom: 10px;">Invalid or Expired OTP. Please try again.</div>
    <form th:action="@{/verify-forgot}" method="post">
        <!-- Hidden field to keep track of the email -->
        <input type="hidden" name="email" th:value="${email}">
        <label>Enter 6-digit OTP:</label>
        <input type="text" name="otp" required><br>
        <button type="submit">Verify OTP</button>
    </form>
</body>
</html>
