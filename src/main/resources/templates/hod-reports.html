<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HOD Reports</title>
</head>
<body>

<div th:replace="~{hod-layout :: layout(~{::main}, 'reports', 'Reports Hub', 'Reports')}">
    <main>
        <!-- Reports Hub -->
        <div class="card shadow-sm border-0 rounded-4 p-4 bg-white text-center">
            <div class="py-4">
                <i class="bi bi-bar-chart-line text-primary" style="font-size: 4rem;"></i>
                <h4 class="fw-bold text-dark mt-3">Department Reports Hub</h4>
                <p class="text-muted">Export and analyze teaching logs, attendance records, and syllabus coverage metrics.</p>
            </div>
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="border rounded-3 p-3 bg-light">
                        <i class="bi bi-journal-check fs-3 text-success"></i>
                        <h6 class="fw-bold mt-2">Diary Entries</h6>
                        <button class="btn btn-sm btn-primary rounded-pill mt-2">Export CSV</button>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="border rounded-3 p-3 bg-light">
                        <i class="bi bi-calendar-check fs-3 text-info"></i>
                        <h6 class="fw-bold mt-2">Attendance Logs</h6>
                        <button class="btn btn-sm btn-primary rounded-pill mt-2">Export PDF</button>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="border rounded-3 p-3 bg-light">
                        <i class="bi bi-book fs-3 text-warning"></i>
                        <h6 class="fw-bold mt-2">Syllabus Progress</h6>
                        <button class="btn btn-sm btn-primary rounded-pill mt-2">Generate Report</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
