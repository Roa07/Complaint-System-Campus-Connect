<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Campus Connect</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7fe;
            font-family: 'Poppins', sans-serif;
        }
        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            background-color: #fff;
            box-shadow: 4px 0 20px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        .main-content {
            margin-left: 260px;
            padding: 30px;
            transition: all 0.3s ease;
        }
        .sidebar .nav-link {
            color: #a3aed1;
            font-weight: 500;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: #4318FF;
            color: #fff;
        }
        @media(max-width: 992px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.active {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar p-4 d-flex flex-column" id="sidebar">
    <div class="logo fs-4 fw-bold text-primary mb-4 px-2" th:text="${user != null ? user.role.replace('ROLE_', '') : 'User'}">
        User
    </div>
    <ul class="nav flex-column flex-grow-1">
        <th:block th:if="${user != null and user.role == 'ROLE_ADMIN'}">
            <li class="nav-item"><a href="/admin/dashboard" class="nav-link"><i class="bi bi-pie-chart-fill"></i> Dashboard</a></li>
            <li class="nav-item"><a href="/admin/users" class="nav-link"><i class="bi bi-people-fill"></i> Manage Users</a></li>
            <li class="nav-item"><a href="/admin/assign" class="nav-link"><i class="bi bi-person-check-fill"></i> Assign</a></li>
            <li class="nav-item"><a href="/admin/reports" class="nav-link"><i class="bi bi-file-earmark-bar-graph-fill"></i> Reports</a></li>
        </th:block>
        <th:block th:if="${user != null and (user.role == 'ROLE_STUDENT' or user.role == 'ROLE_USER')}">
            <li class="nav-item"><a href="/student/dashboard" class="nav-link"><i class="bi bi-grid-fill"></i> Dashboard</a></li>
            <li class="nav-item"><a href="/home2" class="nav-link"><i class="bi bi-plus-circle-fill"></i> New Complaint</a></li>
        </th:block>
        <th:block th:if="${user != null and user.role == 'ROLE_TEACHER'}">
            <li class="nav-item"><a href="/teacher/dashboard" class="nav-link"><i class="bi bi-list-task"></i> Tasks</a></li>
        </th:block>
        <li class="nav-item"><a href="/notifications" class="nav-link"><i class="bi bi-bell-fill"></i> Notifications</a></li>
        <li class="nav-item"><a href="/profile" class="nav-link active"><i class="bi bi-person-fill"></i> Profile</a></li>
    </ul>
    
    <form th:action="@{/logout}" method="post" class="mt-auto">
        <button type="submit" class="btn btn-outline-danger w-100 rounded-3 py-2 fw-semibold"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </form>
</aside>

<!-- Main Content -->
<div class="main-content">
    
    <!-- Topbar -->
    <header class="d-flex justify-content-between align-items-center mb-4 gap-3">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-light d-lg-none rounded-circle p-2 shadow-sm" id="menuToggle"><i class="bi bi-list fs-4"></i></button>
            <h1 class="h3 fw-bold mb-0 text-primary">System Settings</h1>
        </div>
    </header>

    <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
        <ul class="nav nav-tabs mb-4 border-bottom-0" id="settingsTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-semibold border-0 bg-transparent text-primary" id="general-tab" data-bs-toggle="tab" data-bs-target="#general" type="button" role="tab">General</button>
            </li>
        </ul>

        <div class="tab-content" id="settingsTabContent">
            <div class="tab-pane fade show active" id="general" role="tabpanel" aria-labelledby="general-tab">
                <form>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">System Name</label>
                        <input type="text" class="form-control rounded-3" value="Campus Connect Complaint System">
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold">Default Page Language</label>
                        <select class="form-select rounded-3">
                            <option>English</option>
                            <option>Spanish</option>
                            <option>French</option>
                        </select>
                    </div>

                    <button type="button" class="btn btn-primary rounded-3 px-4 py-2 fw-semibold" onclick="alert('Settings Saved Successfully!')">Save Changes</button>
                </form>
            </div>
        </div>
    </div>

</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('menuToggle').addEventListener('click', function(e) {
        e.stopPropagation();
        document.getElementById('sidebar').classList.toggle('active');
    });
    document.addEventListener('click', function(e) {
        const sidebar = document.getElementById('sidebar');
        if (sidebar.classList.contains('active') && !sidebar.contains(e.target)) {
            sidebar.classList.remove('active');
        }
    });
</script>
</body>
</html>
