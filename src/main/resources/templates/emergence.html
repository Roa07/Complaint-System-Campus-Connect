<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Alert - Campus Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: #fff5f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }

        .form-container { 
            background: #ffffff; 
            width: 100%; 
            max-width: 550px; 
            padding: 35px; 
            border-radius: 20px; 
            border: 2px solid #ffc9c9;
            box-shadow: 0 15px 35px rgba(200, 0, 0, 0.1); 
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .header-group { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            border-bottom: 1px solid #ffc9c9; 
            padding-bottom: 15px; 
        }

        h2 { color: #c62828; font-size: 22px; font-weight: 600; }

        .back-btn { 
            text-decoration: none; 
            font-size: 13px; 
            color: #c62828; 
            font-weight: 500; 
            padding: 5px 10px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .back-btn:hover { background: #ffeaea; }

        .badge { 
            display: inline-block; 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 600; 
            background: #ffeaea; 
            color: #c62828; 
            margin-bottom: 15px; 
            text-transform: uppercase; 
        }

        label { 
            display: block; 
            font-size: 13px; 
            font-weight: 500; 
            color: #333; 
            margin-bottom: 6px; 
            margin-top: 15px; 
        }

        input, textarea, select { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1.5px solid #ffc9c9; 
            border-radius: 10px; 
            font-size: 14px; 
            background: #fff; 
            transition: 0.3s;
            outline: none;
        }

        input:focus, textarea:focus, select:focus { 
            border-color: #c62828; 
            box-shadow: 0 0 8px rgba(198, 40, 40, 0.1);
        }

        textarea { resize: none; height: 120px; }

        .note { 
            font-size: 12px; 
            color: #fff; 
            background: #c62828; 
            padding: 12px; 
            border-radius: 8px; 
            margin: 20px 0; 
            line-height: 1.5;
            font-weight: 500;
        }

        .button-group { display: flex; gap: 12px; }

        .btn { 
            flex: 1; 
            padding: 13px; 
            border: none; 
            border-radius: 10px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s; 
        }

        .submit-btn { background: #c62828; color: white; }
        .submit-btn:hover { background: #a51b1b; box-shadow: 0 4px 12px rgba(198, 40, 40, 0.3); }

        .cancel-btn { background: #f1f3f5; color: #495057; }
        .cancel-btn:hover { background: #e9ecef; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header-group">
        <h2>🚨 Send Emergency Alert</h2>
        <a th:href="@{/}" class="back-btn">← Back to Home</a>
    </div>

    <span class="badge">Immediate Broadcast</span>

    <form onsubmit="alert('EMERGENCY BROADCAST SENT TO ALL USERS!'); window.location.href='/'; return false;">

        <label>Current Location</label>
        <select required>
            <option value="">Select Emergency Location</option>
            <option>Main Heritage Building</option>
            <option>Library</option>
            <option>Science Departments</option>
            <option>Arts & Commerce Departments</option>
            <option>Amphitheatre</option>
            <option>Sports Ground</option>
            <option>Canteen</option>
            <option>Auditorium / Seminar Halls</option>
        </select>

        <label>Emergency Instructions / Details</label>
        <textarea placeholder="Tell users what to do... (e.g. Avoid the area, contact security immediately)" required></textarea>

        <label>Emergency Contact No. (Optional)</label>
        <input type="text" placeholder="Mobile number for immediate contact">

        <label>Attach Evidence / Image (Optional)</label>
        <input type="file" accept="image/*">

        <div class="note">
            ⚠️ WARNING: Sending false emergency alerts is a serious offense and will result in strict disciplinary action.
        </div>

        <div class="button-group">
            <button type="submit" class="btn submit-btn">SEND BROADCAST</button>
            <a th:href="@{/}" class="btn cancel-btn" style="text-align: center; text-decoration: none;">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
