<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Classes</title>
</head>
<body>

<div th:replace="~{hod-layout :: layout(~{::main}, 'classes', 'Department Classes', 'Classes')}">
    <main>
        <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
            <h5 class="fw-bold text-dark mb-3">Academic Classes & Divisions</h5>
            <p class="text-muted small">Manage year coordinates, semesters, and division channels for your assigned students.</p>
            <div class="table-responsive mt-3">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Class Code</th>
                            <th>Class / Course Name</th>
                            <th>Division</th>
                            <th>Year Mapped</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="fw-semibold text-primary">FY-A</td>
                            <td>MSc IMCA</td>
                            <td>A</td>
                            <td>First Year (FY)</td>
                        </tr>
                        <tr>
                            <td class="fw-semibold text-primary">SY-A</td>
                            <td>MSc IMCA</td>
                            <td>A</td>
                            <td>Second Year (SY)</td>
                        </tr>
                        <tr>
                            <td class="fw-semibold text-primary">TY-A</td>
                            <td>MSc IMCA</td>
                            <td>A</td>
                            <td>Third Year (TY)</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

</body>
</html>
