<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Diary Logs - Campus Connect</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7fe;
            font-family: 'Poppins', sans-serif;
        }
        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            background-color: #fff;
            box-shadow: 4px 0 20px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        .main-content {
            margin-left: 260px;
            padding: 30px;
            transition: all 0.3s ease;
        }
        .sidebar .nav-link {
            color: #a3aed1;
            font-weight: 500;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: #4318FF;
            color: #fff;
        }
        @media(max-width: 992px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.active {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar p-4 d-flex flex-column" id="sidebar">
    <div class="d-flex align-items-center gap-2 mb-4 px-2">
        <i class="bi bi-shield-fill-check fs-3 text-primary"></i>
        <span class="fs-4 fw-bold text-primary">HOD Panel</span>
    </div>
    <ul class="nav flex-column flex-grow-1">
        <li class="nav-item">
            <a href="/hod/dashboard" class="nav-link active">
                <i class="bi bi-grid-fill"></i> Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a href="/profile" class="nav-link">
                <i class="bi bi-person-fill"></i> Profile
            </a>
        </li>
    </ul>
</aside>

<!-- Main Content -->
<div class="main-content">
    
    <!-- Topbar -->
    <header class="d-flex justify-content-between align-items-center mb-4 gap-3">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-light d-lg-none rounded-circle p-2 shadow-sm" id="menuToggle"><i class="bi bi-list fs-4"></i></button>
            <h1 class="h3 fw-bold mb-0 text-primary">Teacher Diary Logs</h1>
        </div>
        <a href="/hod/dashboard" class="btn btn-outline-primary rounded-3 px-3"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
    </header>

    <div class="card shadow-sm border-0 rounded-4 p-4 bg-white mb-4">
        <div class="mb-4">
            <h4 class="fw-bold mb-1" th:text="${teacher.displayName}">Teacher Name</h4>
            <p class="text-muted mb-0" th:text="${teacher.designation} + ' | ' + ${teacher.department}">CS Dept</p>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Date</th>
                        <th>Subject</th>
                        <th>Class</th>
                        <th>Topic Covered</th>
                        <th>Learning Outcome</th>
                        <th>Attendance</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry : ${diaryEntries}">
                        <td th:text="${entry.date != null ? #temporals.format(entry.date, 'dd MMM yyyy') : 'N/A'}">05 Aug 2026</td>
                        <td th:text="${entry.subject}">Computer Architecture</td>
                        <td th:text="${entry.className} + ' - ' + ${entry.division}">TY - A</td>
                        <td th:text="${entry.topicCovered}">Pipelining basics</td>
                        <td th:text="${entry.learningOutcome}">Understand CPU pipelining</td>
                        <td th:text="${entry.attendance} != null ? ${entry.attendance} : '0'">68</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(diaryEntries)}">
                        <td colspan="6" class="text-center text-muted py-4">No diary entries logged by this teacher.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('menuToggle').addEventListener('click', function(e) {
        e.stopPropagation();
        document.getElementById('sidebar').classList.toggle('active');
    });
    document.addEventListener('click', function(e) {
        const sidebar = document.getElementById('sidebar');
        if (sidebar.classList.contains('active') && !sidebar.contains(e.target)) {
            sidebar.classList.remove('active');
        }
    });
</script>
</body>
</html>
