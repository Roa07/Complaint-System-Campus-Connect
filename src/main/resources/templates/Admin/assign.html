<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Complaints - Campus Connect</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7fe;
            font-family: 'Poppins', sans-serif;
        }
        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            background-color: #fff;
            box-shadow: 4px 0 20px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        .main-content {
            margin-left: 260px;
            padding: 30px;
            transition: all 0.3s ease;
        }
        .sidebar .nav-link {
            color: #a3aed1;
            font-weight: 500;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: #4318FF;
            color: #fff;
        }
        @media(max-width: 992px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.active {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar p-4 d-flex flex-column" id="sidebar">
    <div class="d-flex align-items-center gap-2 mb-4 px-2">
        <i class="bi bi-shield-fill-check fs-3 text-primary"></i>
        <span class="fs-4 fw-bold text-primary">Admin</span>
    </div>
    <ul class="nav flex-column flex-grow-1">
        <li class="nav-item">
            <a href="/admin/dashboard" class="nav-link">
                <i class="bi bi-pie-chart-fill"></i> Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a href="/admin/users" class="nav-link">
                <i class="bi bi-people-fill"></i> Manage Users
            </a>
        </li>
        <li class="nav-item">
            <a href="/admin/assign" class="nav-link active">
                <i class="bi bi-person-check-fill"></i> Assign Complaints
            </a>
        </li>
        <li class="nav-item">
            <a href="/admin/reports" class="nav-link">
                <i class="bi bi-file-earmark-bar-graph-fill"></i> Reports
            </a>
        </li>
        <li class="nav-item">
            <a href="/profile" class="nav-link">
                <i class="bi bi-person-fill"></i> Profile
            </a>
        </li>
    </ul>
    
    <form th:action="@{/logout}" method="post" class="mt-auto">
        <button type="submit" class="btn btn-outline-danger w-100 rounded-3 py-2 fw-semibold"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </form>
</aside>

<!-- Main Content -->
<div class="main-content">
    
    <!-- Topbar -->
    <header class="d-flex justify-content-between align-items-center mb-4 gap-3">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-light d-lg-none rounded-circle p-2 shadow-sm" id="menuToggle"><i class="bi bi-list fs-4"></i></button>
            <h1 class="h3 fw-bold mb-0 text-primary">Assign Complaints</h1>
        </div>
    </header>

    <!-- Stats Grid -->
    <div class="row g-3 mb-4">
        <div class="col-12 col-md-4">
            <div class="card shadow-sm border-0 rounded-4 p-3 bg-white">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 55px; height: 55px;"><i class="bi bi-folder-fill fs-4"></i></div>
                    <div>
                        <h6 class="text-muted mb-1 small fw-semibold">Pending</h6>
                        <h3 class="fw-bold mb-0 text-dark" th:text="${pendingCount}">0</h3>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="card shadow-sm border-0 rounded-4 p-3 bg-white">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-warning bg-opacity-10 text-warning rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 55px; height: 55px;"><i class="bi bi-hourglass-split fs-4"></i></div>
                    <div>
                        <h6 class="text-muted mb-1 small fw-semibold">Assigned</h6>
                        <h3 class="fw-bold mb-0 text-dark" th:text="${assignedCount}">0</h3>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="card shadow-sm border-0 rounded-4 p-3 bg-white">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-success bg-opacity-10 text-success rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 55px; height: 55px;"><i class="bi bi-check-circle-fill fs-4"></i></div>
                    <div>
                        <h6 class="text-muted mb-1 small fw-semibold">Resolved</h6>
                        <h3 class="fw-bold mb-0 text-dark" th:text="${resolvedCount}">0</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Panel -->
    <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
        <h5 class="fw-bold text-primary mb-4">Complaint Assignment</h5>

        <div class="mb-3" style="max-width: 300px;">
            <input type="text" class="form-control rounded-3" placeholder="Search by student..." id="searchBox" onkeyup="filterTable()">
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle" id="complaintsTable">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Student</th>
                        <th>Location</th>
                        <th>Description</th>
                        <th>Priority</th>
                        <th>Assigned Faculty</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${complaints}">
                        <td th:text="'#' + ${c.id}">#1</td>
                        <td th:text="${c.user != null ? c.user.displayName : 'Deleted User'}">Student Name</td>
                        <td th:text="${c.location}">Library</td>
                        <td th:text="${c.description}">Description</td>
                        <td>
                            <span class="badge bg-secondary rounded-pill" th:text="${c.priority != null ? c.priority : 'Not Set'}">High</span>
                        </td>
                        <td th:text="${c.assignedTeacher != null ? c.assignedTeacher.displayName : 'Unassigned'}">Teacher Name</td>
                        <td>
                            <button type="button" class="btn btn-sm btn-primary rounded-3 px-3" th:onclick="'openAssignModal(' + ${c.id} + ')'">Assign</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Bootstrap Modal -->
<div class="modal fade" id="assignModal" tabindex="-1" aria-labelledby="assignModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-primary" id="assignModalLabel">Assign Complaint</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/admin/assign/submit}" method="post">
                <input type="hidden" name="complaintId" id="modalComplaintId">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Select Faculty</label>
                        <select class="form-select rounded-3" name="teacherId" required>
                            <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.displayName}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Priority</label>
                        <select class="form-select rounded-3" name="priority" required>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Due Date</label>
                        <input type="date" class="form-control rounded-3" name="dueDate" required>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-light rounded-3 px-3" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary rounded-3 px-3">Assign</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let modalObj;
    document.addEventListener('DOMContentLoaded', () => {
        modalObj = new bootstrap.Modal(document.getElementById('assignModal'));
    });

    function openAssignModal(id) {
        document.getElementById('modalComplaintId').value = id;
        modalObj.show();
    }
    
    function filterTable() {
        const input = document.getElementById("searchBox").value.toUpperCase();
        const table = document.getElementById("complaintsTable");
        const tr = table.getElementsByTagName("tr");
        for (let i = 1; i < tr.length; i++) {
            const td = tr[i].getElementsByTagName("td")[1];
            if (td) {
                const text = td.textContent || td.innerText;
                tr[i].style.display = text.toUpperCase().indexOf(input) > -1 ? "" : "none";
            }
        }
    }

    document.getElementById('menuToggle').addEventListener('click', function(e) {
        e.stopPropagation();
        document.getElementById('sidebar').classList.toggle('active');
    });
    document.addEventListener('click', function(e) {
        const sidebar = document.getElementById('sidebar');
        if (sidebar.classList.contains('active') && !sidebar.contains(e.target)) {
            sidebar.classList.remove('active');
        }
    });
</script>
</body>
</html>
