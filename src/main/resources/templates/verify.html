<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification - Campus Connect</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

<div class="card shadow-lg border-0 rounded-4 p-4" style="width: 380px; max-width: 100%;">
    <div class="card-body">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">Email Verification</h3>
            <p class="text-muted small">We sent a 6-digit OTP code to your email</p>
        </div>

        <form th:action="@{/verify}" method="post">
            <input type="hidden" name="email" th:value="${email}">

            <div class="form-floating mb-4">
                <input type="text" class="form-control rounded-3 text-center fs-4 fw-bold" style="letter-spacing: 4px;" id="otpInput" name="otp" placeholder="Enter OTP" maxlength="6" required>
                <label for="otpInput">Enter OTP Code</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">Verify</button>
        </form>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
