<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Styles the <h2>Email Verification</h2> */
        h2 {
            text-align: center;
            margin-bottom: 5px;
            color: #333;
        }

        /* Styles the "OTP sent to your email" text */
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Styles the form as the white card container */
        form {
            background: rgb(253, 253, 253);
            padding: 30px;
            width: 320px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        /* Styles the OTP text input */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 16px; /* Slightly larger for OTP readability */
            text-align: center; /* Centers the OTP numbers */
            letter-spacing: 2px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        /* Styles the Verify Button */
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

    </style>
</head>
<body>

<h2>Email Verification</h2>

<p>OTP sent to your email</p>

<form th:action="@{/verify}" method="post">

    <input type="hidden" name="email" th:value="${email}">

    <input type="text" name="otp" placeholder="Enter OTP" required>
    <br><br>

    <button type="submit">Verify</button>

</form>

</body>
</html>
