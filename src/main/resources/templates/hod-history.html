<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HOD Activity History</title>
</head>
<body>

<div th:replace="~{hod-layout :: layout(~{::main}, 'history', 'HOD Activity Log', 'History')}">
    <main>
        <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
            <h5 class="fw-bold text-dark mb-4">My Log History</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Date / Time</th>
                            <th>Operation</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="h : ${historyList}">
                            <td th:text="${#temporals.format(h.createdAt, 'dd MMM yyyy, hh:mm a')}">10 Oct 2026, 10:00 AM</td>
                            <td class="fw-semibold text-primary" th:text="${h.activityType}">Timetable Upload</td>
                            <td th:text="${h.description}">Uploaded timetable configuration file.</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(historyList)}">
                            <td colspan="3" class="text-center text-muted py-3">No activity log entries found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

</body>
</html>
