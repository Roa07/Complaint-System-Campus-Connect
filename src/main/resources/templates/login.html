<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Connect</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

<div class="card shadow-lg border-0 rounded-4 p-4" style="width: 380px; max-width: 100%;">
    <div class="card-body">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">Campus Connect</h2>
            <p class="text-muted">Sign in to your portal</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger text-center py-2" role="alert">
            Invalid credentials OR Email not verified
        </div>

        <div th:if="${param.verified}" class="alert alert-success text-center py-2" role="alert">
            Email verified successfully! Please login.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="emailInput" name="email" placeholder="name@example.com" required>
                <label for="emailInput">Email Address</label>
            </div>
            
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="passwordInput" name="password" placeholder="Password" required>
                <label for="passwordInput">Password</label>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember-me">
                    <label class="form-check-label text-muted" for="remember">Remember Me</label>
                </div>
                <a th:href="@{/forgot}" class="text-primary text-decoration-none small">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-full py-2 fw-semibold rounded-3 mb-3">Login</button>
        </form>

        <div class="text-center mt-3">
            <p class="text-muted small">Don't have an account? <a th:href="@{/register}" class="text-success fw-bold text-decoration-none">Register</a></p>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
