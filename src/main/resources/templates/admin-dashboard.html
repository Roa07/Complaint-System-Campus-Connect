<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Campus Connect</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #f4f7fe;
            font-family: 'Poppins', sans-serif;
        }
        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            background-color: #fff;
            box-shadow: 4px 0 20px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        .main-content {
            margin-left: 260px;
            padding: 30px;
            transition: all 0.3s ease;
        }
        .sidebar .nav-link {
            color: #a3aed1;
            font-weight: 500;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: #4318FF;
            color: #fff;
        }
        @media(max-width: 992px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.active {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar p-4 d-flex flex-column" id="sidebar">
    <div class="d-flex align-items-center gap-2 mb-4 px-2">
        <i class="bi bi-shield-fill-check fs-3 text-primary"></i>
        <span class="fs-4 fw-bold text-primary">Admin</span>
    </div>
    <ul class="nav flex-column flex-grow-1">
        <li class="nav-item">
            <a href="/admin/dashboard" class="nav-link active">
                <i class="bi bi-pie-chart-fill"></i> Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a href="/admin/users" class="nav-link">
                <i class="bi bi-people-fill"></i> Manage Users
            </a>
        </li>
        <li class="nav-item">
            <a href="/admin/assign" class="nav-link">
                <i class="bi bi-person-check-fill"></i> Assign Complaints
            </a>
        </li>
        <li class="nav-item">
            <a href="/admin/reports" class="nav-link">
                <i class="bi bi-file-earmark-bar-graph-fill"></i> Reports
            </a>
        </li>
        <li class="nav-item">
            <a href="/profile" class="nav-link">
                <i class="bi bi-person-fill"></i> Profile
            </a>
        </li>
    </ul>
    
    <form th:action="@{/logout}" method="post" class="mt-auto">
        <button type="submit" class="btn btn-outline-danger w-100 rounded-3 py-2 fw-semibold"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </form>
</aside>

<!-- Main Content -->
<div class="main-content">
    
    <!-- Topbar -->
    <header class="d-flex justify-content-between align-items-center mb-4 gap-3">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-light d-lg-none rounded-circle p-2 shadow-sm" id="menuToggle"><i class="bi bi-list fs-4"></i></button>
            <h1 class="h3 fw-bold mb-0 text-primary">Dashboard</h1>
        </div>
        <div class="d-flex align-items-center gap-3">
            <div class="input-group d-none d-md-flex" style="max-width: 250px;">
                <span class="input-group-text bg-white border-end-0 rounded-start-pill"><i class="bi bi-search text-muted"></i></span>
                <input type="text" class="form-control border-start-0 rounded-end-pill" placeholder="Search complaints...">
            </div>
            <div class="d-flex align-items-center gap-2">
                <img src="https://ui-avatars.com/api/?name=Admin&background=4318FF&color=fff" class="rounded-circle border border-2 border-white shadow-sm" style="width: 42px; height: 42px;" alt="Profile">
                <div class="d-none d-sm-block text-start">
                    <h6 class="mb-0 fw-semibold text-dark" th:text="${user != null ? user.firstName : 'Admin'}">Admin Name</h6>
                    <small class="text-muted">Administrator</small>
                </div>
            </div>
        </div>
    </header>

    <!-- Stats Cards -->
    <div class="row g-3 mb-4">
        <div class="col-12 col-md-4">
            <div class="card shadow-sm border-0 rounded-4 p-3 bg-white">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 55px; height: 55px;"><i class="bi bi-folder-fill fs-4"></i></div>
                    <div>
                        <h6 class="text-muted mb-1 small fw-semibold">Total Complaints</h6>
                        <h3 class="fw-bold mb-0 text-dark" th:text="${totalComplaints}">0</h3>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="card shadow-sm border-0 rounded-4 p-3 bg-white">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-warning bg-opacity-10 text-warning rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 55px; height: 55px;"><i class="bi bi-hourglass-split fs-4"></i></div>
                    <div>
                        <h6 class="text-muted mb-1 small fw-semibold">Pending</h6>
                        <h3 class="fw-bold mb-0 text-dark" th:text="${pendingComplaints}">0</h3>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="card shadow-sm border-0 rounded-4 p-3 bg-white">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-success bg-opacity-10 text-success rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 55px; height: 55px;"><i class="bi bi-check-circle-fill fs-4"></i></div>
                    <div>
                        <h6 class="text-muted mb-1 small fw-semibold">Resolved</h6>
                        <h3 class="fw-bold mb-0 text-dark" th:text="${resolvedComplaints}">0</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Content Grid -->
    <div class="row g-4">
        <!-- Table Panel -->
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold text-primary mb-0">Recent Complaints</h5>
                    <a href="/admin/assign" class="text-primary text-decoration-none small fw-semibold">View All</a>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Location</th>
                                <th>Student</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="complaint : ${complaints}">
                                <td th:text="'#' + ${complaint.id}">#102</td>
                                <td th:text="${complaint.location}">Library</td>
                                <td th:text="${complaint.user != null ? complaint.user.firstName : 'Unknown'}">John Doe</td>
                                <td>
                                    <span th:if="${complaint.status != null and complaint.status.name() == 'PENDING'}" class="badge bg-warning rounded-pill">Pending</span>
                                    <span th:if="${complaint.status != null and complaint.status.name() == 'APPROVED'}" class="badge bg-success rounded-pill">Approved</span>
                                    <span th:if="${complaint.status != null and complaint.status.name() == 'REJECTED'}" class="badge bg-danger rounded-pill">Rejected</span>
                                </td>
                                <td>
                                    <div class="d-flex gap-2">
                                        <form th:if="${complaint.status != null and complaint.status.name() == 'PENDING'}" th:action="@{/admin/approve/{id}(id=${complaint.id})}" method="post">
                                            <button type="submit" class="btn btn-sm btn-outline-success rounded-3 px-3">Approve</button>
                                        </form>
                                        <form th:if="${complaint.status != null and complaint.status.name() == 'PENDING'}" th:action="@{/admin/reject/{id}(id=${complaint.id})}" method="post">
                                            <button type="submit" class="btn btn-sm btn-outline-danger rounded-3 px-3">Reject</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Chart Panel -->
        <div class="col-12 col-lg-4">
            <div class="card shadow-sm border-0 rounded-4 p-4 bg-white h-100">
                <div class="panel-header mb-4">
                    <h5 class="fw-bold text-primary mb-0">Analytics Overview</h5>
                </div>
                <div class="d-flex align-items-center justify-content-center" style="height: 250px;">
                    <canvas id="analyticsChart"></canvas>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart Setup -->
<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', () => {
        try {
            const pending = /*[[${pendingComplaints}]]*/ 10;
            const resolved = /*[[${resolvedComplaints}]]*/ 20;

            const chartEl = document.getElementById('analyticsChart');
            if (chartEl && typeof Chart !== 'undefined') {
                const ctx = chartEl.getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Pending', 'Resolved'],
                        datasets: [{
                            data: [pending, resolved],
                            backgroundColor: ['#ffb300', '#2ec771'],
                            borderWidth: 0,
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom' }
                        },
                        cutout: '75%'
                    }
                });
            }
        } catch (e) {
            console.error("Error initializing Chart.js:", e);
        }
    });

    document.getElementById('menuToggle').addEventListener('click', function(e) {
        e.stopPropagation();
        document.getElementById('sidebar').classList.toggle('active');
    });
    document.addEventListener('click', function(e) {
        const sidebar = document.getElementById('sidebar');
        if (sidebar.classList.contains('active') && !sidebar.contains(e.target)) {
            sidebar.classList.remove('active');
        }
    });
    /*]]>*/
</script>
</body>
</html>
