<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Attendance QR - Campus Connect</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7fe;
            font-family: 'Poppins', sans-serif;
        }
        .card-radius {
            border-radius: 18px;
        }
    </style>
</head>
<body class="py-4">

<div class="container" style="max-width: 600px;">
    
    <!-- Navigation Back Button & Breadcrumbs -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="${user.role == 'ROLE_HOD' ? '/hod/dashboard' : '/teacher/dashboard'}" class="text-decoration-none">Dashboard</a></li>
                <li class="breadcrumb-item active" aria-current="page">Generate Attendance QR</li>
            </ol>
        </nav>
        <a th:href="${user.role == 'ROLE_HOD' ? '/hod/dashboard' : '/teacher/dashboard'}" class="btn btn-outline-primary btn-sm rounded-3"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
    </div>

    <!-- QR Config Form -->
    <div class="card shadow-sm border-0 card-radius p-4 bg-white mb-4">
        <h5 class="fw-bold text-dark mb-3"><i class="bi bi-qr-code text-primary"></i> Attendance QR Session Config</h5>
        <form id="qrConfigForm" onsubmit="generateSession(event)">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">Subject</label>
                <input type="text" class="form-control rounded-3" id="subject" th:value="${param.subject}" required>
            </div>
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label small fw-semibold text-muted">Class / Course</label>
                    <input type="text" class="form-control rounded-3" id="course" th:value="${param.course}" placeholder="e.g. MSc IMCA" required>
                </div>
                <div class="col-6">
                    <label class="form-label small fw-semibold text-muted">Division</label>
                    <input type="text" class="form-control rounded-3" id="division" th:value="${param.division}" placeholder="e.g. A" required>
                </div>
            </div>
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label small fw-semibold text-muted">Semester</label>
                    <input type="text" class="form-control rounded-3" id="semester" placeholder="e.g. Semester 2" required>
                </div>
                <div class="col-6">
                    <label class="form-label small fw-semibold text-muted">Lecture Number</label>
                    <input type="number" class="form-control rounded-3" id="lectureNumber" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-3 py-2 fw-semibold">Generate Session QR</button>
        </form>
    </div>

    <!-- Generated QR Showcase -->
    <div id="qrShowcase" class="card shadow-sm border-0 card-radius p-4 bg-white text-center d-none">
        <h5 class="fw-bold text-dark mb-3">Unique Attendance Session QR</h5>
        <div class="mb-3">
            <!-- Google Chart API for rendering QR codes -->
            <img id="qrImage" src="" alt="Attendance QR Code" style="width: 250px; height: 250px;" class="border p-2 rounded bg-light">
        </div>
        <p class="mb-1 text-muted small">Session Token: <strong id="sessionToken" class="text-dark">TOKEN</strong></p>
        <p class="mb-0 text-danger small fw-semibold"><i class="bi bi-clock"></i> QR Valid Until: <span id="expiryTime">10:30 PM</span></p>
    </div>

</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    async function generateSession(event) {
        event.preventDefault();
        const subject = document.getElementById("subject").value;
        const course = document.getElementById("course").value;
        const division = document.getElementById("division").value;
        const semester = document.getElementById("semester").value;
        const lectureNumber = document.getElementById("lectureNumber").value;

        try {
            const response = await fetch(`/api/attendance/session?subject=${subject}&course=${course}&division=${division}&semester=${semester}&lectureNumber=${lectureNumber}`, { method: 'POST' });
            const data = await response.json();

            if (response.ok) {
                // Populate QR image
                document.getElementById("qrImage").src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${data.token}`;
                document.getElementById("sessionToken").innerText = data.token;
                document.getElementById("expiryTime").innerText = data.validUntil;
                document.getElementById("qrShowcase").classList.remove("d-none");
            }
        } catch(e) {
            alert("Failed to generate QR session.");
        }
    }
</script>
</body>
</html>
