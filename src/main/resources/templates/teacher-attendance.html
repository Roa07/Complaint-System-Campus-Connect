<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Attendance Monitoring - Campus Connect</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7fe;
            font-family: 'Poppins', sans-serif;
        }
        .card-radius {
            border-radius: 18px;
        }
    </style>
</head>
<body class="py-4">

<div class="container" style="max-width: 900px;">
    
    <!-- Navigation Back Button & Breadcrumbs -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/teacher/dashboard" class="text-decoration-none">Dashboard</a></li>
                <li class="breadcrumb-item active" aria-current="page">Attendance Monitor</li>
            </ol>
        </nav>
        <a href="/teacher/dashboard" class="btn btn-outline-primary btn-sm rounded-3"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
    </div>

    <!-- Active Sessions table -->
    <div class="card shadow-sm border-0 card-radius p-4 bg-white">
        <h5 class="fw-bold text-dark mb-3">My Attendance QR Sessions</h5>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Subject</th>
                        <th>Class & Div</th>
                        <th>Lect. No.</th>
                        <th>Generated Time</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${sessions}">
                        <td th:text="${s.subject}">AI</td>
                        <td th:text="${s.course} + ' - ' + ${s.division}">MSc IMCA - A</td>
                        <td th:text="${s.lectureNumber}">1</td>
                        <td th:text="${#temporals.format(s.generatedTime, 'dd MMM hh:mm a')}">10 Oct 10:00 AM</td>
                        <td>
                            <span class="badge" th:classappend="${s.status == 'Active' ? 'bg-success' : 'bg-secondary'}" th:text="${s.status}">Active</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(sessions)}">
                        <td colspan="5" class="text-center text-muted py-3">No QR attendance sessions generated yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
