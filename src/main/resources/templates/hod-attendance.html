<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HOD Attendance Monitoring</title>
</head>
<body>

<div th:replace="~{hod-layout :: layout(~{::main}, 'attendance', 'Attendance Monitoring', 'Attendance')}">
    <main>
        <!-- Active Sessions table -->
        <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
            <h5 class="fw-bold text-dark mb-3">Active Attendance Tracking Sessions</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Subject</th>
                            <th>Faculty</th>
                            <th>Class & Div</th>
                            <th>Lect. No.</th>
                            <th>Generated Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${sessions}">
                            <td th:text="${s.subject}">AI</td>
                            <td th:text="${s.teacher.displayName}">Prof. Sneha Patil</td>
                            <td th:text="${s.course} + ' - ' + ${s.division}">MSc IMCA - A</td>
                            <td th:text="${s.lectureNumber}">1</td>
                            <td th:text="${#temporals.format(s.generatedTime, 'dd MMM hh:mm a')}">10 Oct 10:00 AM</td>
                            <td>
                                <span class="badge" th:classappend="${s.status == 'Active' ? 'bg-success' : 'bg-secondary'}" th:text="${s.status}">Active</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(sessions)}">
                            <td colspan="6" class="text-center text-muted py-3">No active QR attendance sessions generated today.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

</body>
</html>
