<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Complaint - Campus Connect</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

<div class="card shadow-lg border-0 rounded-4 p-4 position-relative" style="width: 500px; max-width: 100%;">
    <div class="card-body">
        
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">Post Complaint</h3>
            <p class="text-muted small">Submit details regarding campus infrastructure or services</p>
        </div>

        <div class="alert alert-success d-none py-2 text-center rounded-3" id="successMsg" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> Complaint posted successfully!
        </div>

        <form th:action="@{/submit}" method="post" enctype="multipart/form-data" onsubmit="return validateForm()">
            <div class="mb-3">
                <label for="description" class="form-label text-muted small fw-semibold">Description</label>
                <textarea class="form-control rounded-3" name="description" id="description" rows="4" placeholder="Explain the issue in detail (min 10 chars)..." required></textarea>
                <div class="invalid-feedback" id="descError">Description must be at least 10 characters.</div>
            </div>

            <div class="mb-3">
                <label for="location" class="form-label text-muted small fw-semibold">Location</label>
                <select class="form-select rounded-3" name="location" id="location" required>
                    <option value="">Select Location</option>
                    <option>Library</option>
                    <option>Canteen</option>
                    <option>Auditorium</option>
                    <option>Hostel</option>
                </select>
                <div class="invalid-feedback" id="locError">Please select a location.</div>
            </div>

            <div class="mb-3">
                <label for="blockName" class="form-label text-muted small fw-semibold">Block Name (Optional)</label>
                <input type="text" class="form-control rounded-3" name="blockName" id="blockName" placeholder="e.g. Block A, Room 204">
            </div>

            <div class="mb-3">
                <label for="imageInput" class="form-label text-muted small fw-semibold">Upload Photo</label>
                <input class="form-control rounded-3" type="file" name="image" id="imageInput" accept="image/*">
            </div>

            <div class="mb-4 text-center">
                <img id="preview" class="img-fluid rounded-3 border d-none" style="max-height: 200px; width: 100%; object-fit: cover;" alt="Preview image">
            </div>

            <div class="row g-2">
                <div class="col-6">
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 d-flex align-items-center justify-content-center gap-2">
                        <span>Post</span>
                        <span class="spinner-border spinner-border-sm d-none" id="spinner" role="status" aria-hidden="true"></span>
                    </button>
                </div>
                <div class="col-6">
                    <button type="button" class="btn btn-light w-100 py-2 fw-semibold rounded-3 border" onclick="history.back()">Cancel</button>
                </div>
            </div>
        </form>

    </div>
</div>

<script>
    // Image Preview
    document.getElementById("imageInput").addEventListener("change", function(e) {
        const file = e.target.files[0];
        const preview = document.getElementById("preview");

        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.classList.remove("d-none");
        }
    });

    // Validation
    function validateForm() {
        let valid = true;
        const desc = document.getElementById("description");
        const loc = document.getElementById("location");

        desc.classList.remove("is-invalid");
        loc.classList.remove("is-invalid");

        if (desc.value.trim().length < 10) {
            desc.classList.add("is-invalid");
            valid = false;
        }

        if (loc.value === "") {
            loc.classList.add("is-invalid");
            valid = false;
        }

        if (valid) {
            document.getElementById("spinner").classList.remove("d-none");
        }
        return valid;
    }

    // Show success message if redirected
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('success')) {
        document.getElementById("successMsg").classList.remove("d-none");
    }
</script>
<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
