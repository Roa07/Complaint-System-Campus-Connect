<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Report - Campus Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: #f4f6f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }

        .form-container { 
            background: #ffffff; 
            width: 100%; 
            max-width: 550px; 
            padding: 35px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1); 
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-group { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 15px; 
        }

        h2 { color: #1e3c72; font-size: 22px; font-weight: 600; }

        .back-btn { 
            text-decoration: none; 
            font-size: 13px; 
            color: #1e3c72; 
            font-weight: 500; 
            padding: 5px 10px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .back-btn:hover { background: #e8f0ff; }

        .badge { 
            display: inline-block; 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 600; 
            background: #fff1e6; 
            color: #e65100; 
            margin-bottom: 15px; 
            text-transform: uppercase; 
        }

        label { 
            display: block; 
            font-size: 13px; 
            font-weight: 500; 
            color: #333; 
            margin-bottom: 6px; 
            margin-top: 15px; 
        }

        input, select, textarea { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1.5px solid #e0e0e0; 
            border-radius: 10px; 
            font-size: 14px; 
            background: #fafafa; 
            transition: 0.3s;
            outline: none;
        }

        input:focus, textarea:focus { 
            border-color: #e65100; 
            background: #fff; 
            box-shadow: 0 0 8px rgba(230, 81, 0, 0.1);
        }

        textarea { resize: none; height: 120px; }

        .note { 
            font-size: 12px; 
            color: #555; 
            background: #fff3e0; 
            padding: 12px; 
            border-radius: 8px; 
            margin: 20px 0; 
            border-left: 4px solid #e65100; 
            line-height: 1.5;
        }

        .button-group { display: flex; gap: 12px; }

        .btn { 
            flex: 1; 
            padding: 13px; 
            border: none; 
            border-radius: 10px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s; 
        }

        .submit-btn { background: #e65100; color: white; }
        .submit-btn:hover { background: #bf4300; box-shadow: 0 4px 12px rgba(230, 81, 0, 0.3); }

        .cancel-btn { background: #f1f3f5; color: #495057; }
        .cancel-btn:hover { background: #e9ecef; }
    </style>
    <link rel="stylesheet" th:href="@{/responsive.css}" href="/responsive.css">
</head>
<body>

<div class="form-container">
    <div class="header-group">
        <h2>Report Campus Issue</h2>
        <a th:href="@{/}" class="back-btn">← Back to Home</a>
    </div>

    <span class="badge">Issue Report</span>

    <!-- Adapted to submit to your backend properly -->
    <form th:action="@{/submit}" method="post" enctype="multipart/form-data">
        
        <label>Upload Evidence (Photo)</label>
        <input type="file" name="image" accept="image/*" required>

        <label>Campus Location</label>
        <select name="location" required>
            <option value="">Select Location</option>
            <option>Main Heritage Building</option>
            <option>Library</option>
            <option>Science Department Block</option>
            <option>Arts & Commerce Block</option>
            <option>Amphitheatre</option>
            <option>Sports Ground</option>
            <option>Canteen</option>
            <option>Auditorium / Seminar Hall</option>
        </select>

        <label>Building / Room / Specific Area</label>
        <input type="text" name="blockName" placeholder="e.g. IT Block, Room 302 or Near Basketball Court" required>

        <label>Problem Description</label>
        <textarea name="description" placeholder="Please describe the issue in detail (e.g. broken fan, cleanliness issue, etc.)..." required></textarea>

        <p class="note">📌 Note: This complaint will be forwarded to the campus maintenance department. Your identity will remain confidential.</p>

        <div class="button-group">
            <button type="submit" class="btn submit-btn">Submit Report</button>
            <a th:href="@{/}" class="btn cancel-btn" style="text-align: center; text-decoration: none;">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
