<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .profile-card {
            background: white;
            width: 420px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .profile-img {
            display: block;
            margin: auto;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .success { color: green; }
        .error { color: red; }

        hr { margin: 25px 0; }
    </style>
</head>
<body>

<div class="profile-card">

    <h2 style="text-align:center;">Profile</h2>

    <!-- SUCCESS -->
    <div th:if="${param.updated}" class="success">
        Profile updated successfully
    </div>

    <div th:if="${param.passwordChanged}" class="success">
        Password changed successfully
    </div>

    <div th:if="${error}" class="error">
        <span th:text="${error}"></span>
    </div>

    <!-- PROFILE IMAGE -->
    <img th:if="${user.profileImage != null}"
         th:src="@{'/uploads/profile/' + ${user.profileImage}}"
         class="profile-img">

    <br><br>

    <!-- EDIT PROFILE FORM -->
    <form th:action="@{/profile/update}"
          th:object="${user}"
          method="post"
          enctype="multipart/form-data">

        <input type="text" th:field="*{firstName}" placeholder="First Name" required>
        <input type="text" th:field="*{middleName}" placeholder="Middle Name">
        <input type="text" th:field="*{lastName}" placeholder="Last Name" required>
        <input type="email" th:field="*{email}" placeholder="Email" required>

        <input type="file" name="image">

        <button type="submit">Update Profile</button>
    </form>

    <hr>

    <!-- CHANGE PASSWORD -->
    <h3>Change Password</h3>

    <form th:action="@{/profile/change-password}" method="post">

        <input type="password" name="oldPassword" placeholder="Old Password" required>
        <input type="password" name="newPassword" placeholder="New Password" required>
        <input type="password" name="confirmPassword" placeholder="Confirm Password" required>

        <button type="submit">Change Password</button>
    </form>

    <br>
    <a th:href="@{/logout}">Logout</a>

</div>

</body>
</html>
