<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .profile-card {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .info {
            margin-bottom: 15px;
        }

        .label {
            font-weight: bold;
            color: #333;
        }

        .value {
            margin-top: 4px;
            color: #555;
        }

        .back-btn {
            margin-top: 20px;
            display: block;
            text-align: center;
            padding: 10px;
            background: #007bff;
            color: white;
            border-radius: 6px;
            text-decoration: none;
        }

        .back-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="profile-card">
    <h2>My Profile</h2>

    <div class="info">
        <div class="label">User ID</div>
        <div class="value" th:text="${user.id}"></div>
    </div>

    <div class="info">
        <div class="label">Email</div>
        <div class="value" th:text="${user.email}"></div>
    </div>

    <div class="info">
        <div class="label">Role</div>
        <div class="value" th:text="${user.role}"></div>
    </div>

    <a th:href="@{/home}" class="back-btn">Back to Home</a>
</div>

</body>
</html>
