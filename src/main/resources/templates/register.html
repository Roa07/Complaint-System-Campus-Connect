<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        /* Modern Gradient Background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #fae8ff 50%, #f5f3ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* The Glass-style Container */
        .register-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h2 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 30px;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #4b5563;
            margin-bottom: 8px;
        }

        /* Input Styling to match the image */
        input, select {
            width: 100%;
            padding: 14px 16px;
            background: #f3f4f6;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            color: #1f2937;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #9ca3af;
        }

        input:focus, select:focus {
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 2px #6366f1;
        }

        /* Password Wrapper for the "Show" button */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .show-toggle {
            position: absolute;
            right: 16px;
            font-size: 13px;
            color: #4b5563;
            cursor: pointer;
            font-weight: 500;
            user-select: none;
        }

        /* The Primary Blue Button */
        button {
            width: 100%;
            padding: 16px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #4338ca;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #6b7280;
        }

        .login-footer a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="register-card">
    <h2>Register</h2>

    <form th:action="@{/register}" method="post" th:object="${user}">

        <div class="form-group">
            <label>Name</label>
            <input type="text" th:field="*{firstName}" placeholder="first name" required>
            <input type="text" th:field="*{middleName}" placeholder="middle name" required>
            <input type="text" th:field="*{lastName}" placeholder="last name" required>

        </div>

        <div class="form-group">
            <label>Role</label>
            <select th:field="*{role}" required>
                <option value="">Choose Role</option>
                <option value="ROLE_ADMIN">Admin</option>
                <option value="ROLE_TEACHER">Teacher</option>
                <option value="ROLE_STUDENT">Student</option>
                <option value="ROLE_OTHER">Others</option>
            </select>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="Email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="password-wrapper">
                <input type="password" th:field="*{password}" id="pass1"
                       placeholder="Enter password"
                       pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$"
                       required>
                <span class="show-toggle" onclick="togglePass('pass1')">Show</span>
            </div>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <div class="password-wrapper">
                <input type="password" name="confirmPassword" id="pass2"
                       placeholder="Retype password" required>
                <span class="show-toggle" onclick="togglePass('pass2')">Show</span>
            </div>
        </div>

        <button type="submit">Register</button>
    </form>

    <div class="login-footer">
        Already have an account? <a th:href="@{/login}">Login</a>
    </div>
</div>

<script>
    function togglePass(id) {
        const input = document.getElementById(id);
        const toggle = event.target;
        if (input.type === "password") {
            input.type = "text";
            toggle.textContent = "Hide";
        } else {
            input.type = "password";
            toggle.textContent = "Show";
        }
    }
</script>

</body>
</html>
