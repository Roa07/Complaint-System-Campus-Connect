<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>403 - Access Denied</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0; background: #f4f6f9; color: #333; font-family: 'Poppins', sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center;
        }
        .error-container {
            background: #fff; padding: 50px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 500px;
        }
        .error-container h1 { font-size: 80px; margin: 0; color: #e74c3c; }
        .error-container h2 { font-size: 24px; margin: 10px 0; color: #333; }
        .error-container p { color: #666; margin-bottom: 30px; }
        .btn {
            background: #1e3c72; color: #fff; text-decoration: none; padding: 12px 25px; border-radius: 8px; font-weight: 500; transition: 0.3s;
        }
        .btn:hover { background: #2a5298; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>403</h1>
        <h2>Access Denied</h2>
        <p>Sorry, you don't have permission to view this page. If you think this is a mistake, please contact support.</p>
        <a href="/" class="btn">Go Home</a>
    </div>
</body>
</html>
