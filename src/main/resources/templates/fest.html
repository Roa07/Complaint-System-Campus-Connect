<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Post Tech Fest - Campus Connect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Poppins', sans-serif; 
        }

        body { 
            background: #f4f6f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }

        .form-container { 
            background: #ffffff; 
            width: 100%; 
            max-width: 550px; 
            padding: 35px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1); 
        }

        .header-group { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 15px; 
        }

        h2 { 
            color: #1e3c72; 
            font-size: 22px; 
            font-weight: 600; 
        }

        .back-btn { 
            text-decoration: none; 
            font-size: 13px; 
            color: #1e3c72; 
            font-weight: 500; 
            padding: 5px 10px; 
            border-radius: 5px; 
            transition: 0.3s; 
        }

        .back-btn:hover { 
            background: #e8f0ff; 
        }

        .badge { 
            display: inline-block; 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 600; 
            background: #e8f0ff; 
            color: #2962ff; 
            margin-bottom: 15px; 
            text-transform: uppercase; 
        }

        label { 
            display: block; 
            font-size: 13px; 
            font-weight: 500; 
            color: #333; 
            margin-bottom: 6px; 
            margin-top: 15px; 
        }

        input, select, textarea { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1.5px solid #e0e0e0; 
            border-radius: 10px; 
            font-size: 14px; 
            background: #fafafa; 
            outline: none; 
            transition: 0.3s;
        }

        textarea { 
            resize: none; 
            height: 100px; 
        }

        input:focus, 
        select:focus, 
        textarea:focus {
            border-color: #007bff;
            background: #ffffff;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }

        .note { 
            font-size: 12px; 
            color: #555; 
            background: #fff9db; 
            padding: 12px; 
            border-radius: 8px; 
            margin: 20px 0; 
            border-left: 4px solid #fcc419; 
        }

        .button-group { 
            display: flex; 
            gap: 12px; 
        }

        .btn { 
            flex: 1; 
            padding: 13px; 
            border: none; 
            border-radius: 10px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s; 
        }

        .submit-btn { 
            background: #007bff; 
            color: white; 
        }

        .submit-btn:hover {
            background: #0056b3;
        }

        .cancel-btn { 
            background: #f1f3f5; 
            color: #495057; 
        }

        .cancel-btn:hover {
            background: #e0e0e0;
        }
    </style>
</head>

<body>

<div class="form-container">

    <div class="header-group">
        <h2>Post Tech Fest</h2>
        <a th:href="@{/}" class="back-btn">← Back to Home</a>
    </div>

    <span class="badge">Event Category</span>

    <form id="eventForm">

        <label>Upload Event Poster</label>
        <input type="file" accept="image/*" required>

        <label>Event Name / Title</label>
        <input type="text" placeholder="e.g. Annual Tech Symposium" required>

        <label>Event Description</label>
        <textarea placeholder="Tell us about the event..."></textarea>

        <!-- ✅ UPDATED LOCATION OPTIONS -->
        <label>Campus Location</label>
        <select required>
            <option value="">Select Venue</option>
            <option>Main Heritage Building</option>
            <option>Library</option>
            <option>Science Department Block</option>
            <option>Arts & Commerce Block</option>
            <option>Amphitheatre</option>
            <option>Sports Ground</option>
            <option>Canteen</option>
            <option>Auditorium / Seminar Hall</option>
        </select>

        <p class="note">📌 Note: Once posted, this event will be reviewed before appearing on the home page.</p>

        <div class="button-group">
            <button type="submit" class="btn submit-btn">Post Event</button>
            <a th:href="@{/}" class="btn cancel-btn" style="text-align: center; text-decoration: none;">Cancel</a>
        </div>

    </form>

</div>

<script>
    document.getElementById('eventForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert("Event Posted Successfully!");
        window.location.href = "/";
    });
</script>

</body>
</html>
